[project]
name = "ecommerce-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "fastapi>=0.162.7",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]